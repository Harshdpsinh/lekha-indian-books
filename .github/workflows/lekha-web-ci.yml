name: Lekha Web CI
on:
  push:
    branches: [feature/vercel-online-lekha]
    paths:
      - "web/**"
      - ".github/workflows/lekha-web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/lekha-web-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Python cloud backup syntax check
        run: python -m compileall -q ../cloud_backup
      - name: Install backup test packages
        run: python -m pip install cryptography requests google-api-python-client google-auth
      - name: Encrypted backup roundtrip tests
        run: PYTHONPATH=.. python -m unittest discover -s ../cloud_backup/tests -p 'test_*.py' -v
      - name: Run synthetic PDF extraction tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Next.js production build
        run: npm run build
