name: Lekha Online Encrypted Drive Backup
on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.LEKHA_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LEKHA_SUPABASE_SERVICE_ROLE_KEY }}
      LEKHA_USER_ID: ${{ secrets.LEKHA_USER_ID }}
      LEKHA_BACKUP_PASSPHRASE: ${{ secrets.LEKHA_BACKUP_PASSPHRASE }}
      LEKHA_GDRIVE_CLIENT_ID: ${{ secrets.LEKHA_GDRIVE_CLIENT_ID }}
      LEKHA_GDRIVE_CLIENT_SECRET: ${{ secrets.LEKHA_GDRIVE_CLIENT_SECRET }}
      LEKHA_GDRIVE_REFRESH_TOKEN: ${{ secrets.LEKHA_GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify backup is configured
        run: |
          python - <<'PY'
          import os
          required=["SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","LEKHA_USER_ID","LEKHA_BACKUP_PASSPHRASE","LEKHA_GDRIVE_CLIENT_ID","LEKHA_GDRIVE_CLIENT_SECRET","LEKHA_GDRIVE_REFRESH_TOKEN"]
          missing=[name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit("Backup NOT configured. Missing secrets: "+", ".join(missing))
          PY
      - name: Install runtime packages
        run: python -m pip install --disable-pip-version-check cryptography requests google-api-python-client google-auth
      - name: Export, encrypt and upload private snapshot
        run: python -m cloud_backup.backup
